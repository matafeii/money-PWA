<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef6ff"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Мои финансы</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;color:#11213a;--muted:#6e7d92;--blue:#087ef5;--red:#ed4c61;--green:#1d9c62;--glass:rgba(255,255,255,.64);--line:rgba(255,255,255,.88);--shadow:0 18px 45px rgba(49,78,117,.14),inset 0 1px 0 #fff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 8% 4%,#9bd2ff 0,transparent 35%),radial-gradient(circle at 95% 30%,#d9c4ff 0,transparent 32%),linear-gradient(145deg,#f9fcff,#eef6ff 50%,#faf5ff);background-attachment:fixed}button,input{font:inherit}.app{max-width:620px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}.glass{background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%)}header{display:flex;justify-content:space-between;align-items:center;margin:0 2px 19px}.date{font-size:13px;color:var(--muted);font-weight:600;text-transform:capitalize}h1{font-size:30px;line-height:1.1;letter-spacing:-.04em;margin:2px 0 0}.settings{width:44px;height:44px;border-radius:16px;border:1px solid var(--line);background:var(--glass);box-shadow:var(--shadow);font-size:20px}.hero{position:relative;overflow:hidden;color:#fff;border-radius:29px;padding:22px;background:linear-gradient(145deg,rgba(5,132,255,.94),rgba(82,78,224,.88));box-shadow:0 24px 50px rgba(30,94,196,.26),inset 0 1px 0 rgba(255,255,255,.5)}.hero:after{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:-55px;top:-115px;background:rgba(255,255,255,.2)}.label{font-size:14px;opacity:.82;font-weight:600}.balance{font-size:39px;line-height:1.12;font-weight:780;letter-spacing:-.045em;margin-top:6px;font-variant-numeric:tabular-nums}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.stat{min-width:0;padding:12px;border-radius:17px;background:rgba(255,25 tom));box-shadow:0 -20px 65px #263c5d33;animation:up .25s ease}.grab{width:38px;height:5px;border-radius:5px;background:#53647d3b;margin:0 auto 13px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheet-head h2{font-size:23px}.close{width:34px;height:34px;border:0;border-radius:50%;background:#53647d18;color:#53647d;font-size:22px}.field{margin:13px 0}.field label,.field-title{display:block;font-size:13px;color:var(--muted);font-weight:650;margin:0 0 7px 4px}input{width:100%;border:1px solid #8fa7c43d;border-radius:17px;background:#ffffffcf;padding:14px 15px;outline:none;color:#11213a;font-size:16px}.amount-input{text-align:center;font-size:29px;font-weight:760}.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.category{min-width:0;border:1px solid #fff;border-radius:17px;background:#ffffff99;padding:10px 2px 8px;color:var(--muted);font-size:11px;font-weight:650}.category span{display:block;font-size:22px;margin-bottom:5px}.category.selected{color:#0767cc;background:#0a84ff1c;border-color:#0a84ff3d}.form-actions{display:grid;grid-template-columns:1fr 1.45fr;gap:10px;margin-top:18px}.btn{border:0;border-radius:17px;padding:14px 8px;font-size:16px;font-weight:720;color:#17243a;background:#6c7b9118}.btn.primary{color:#fff;background:linear-gradient(135deg,#0784ff,#5c61e7);box-shadow:0 10px 23px #236edc38}.danger{width:100%;border:0;background:transparent;color:var(--red);font-weight:650;padding:15px 5px 2px}.settings-actions{display:grid;gap:9px}.settings-actions button{border:1px solid #fff;border-radius:17px;background:#ffffffa8;padding:14px;text-align:left;font-weight:680;color:#16243a}.version{text-align:center;color:var(--muted);font-size:11px;margin-top:16px}.toast{position:fixed;z-index:20;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;background:#17243ae8;color:#fff;border-radius:99px;padding:11px 16px;font-size:13px;font-weight:650;transition:.25 </style></head><body><main class="app"><header><div><div class="date" id="today">Сегодня</div><h1>Мои финансы</h1></div><button class="settings" onclick="openSettings()" aria-label="Настройки">⚙︎</button></header><section class="hero"><div class="label">Общий баланс</div><div class="balance" id="total">0,00 zł</div><div class="stats"><div class="stat"><small>● Доход за месяц</small><b id="income">0,00 zł</b></div><div class="stat"><small>● Расходы за месяц</small><b id="expense">0,00 zł</b></div></div></section><div class="actions"><button class="action expense" onclick="openForm('expense')"><i>−</i>Расход</button><button class="action income" onclick="openForm('income')"><i>+</i>Доход</button></div><section><div class="section-head"><h2>Операции</h2><span class="month" id="month"></span></div><div class="list" id="list"></div></section></main>
<div class="modal" id="modal" onclick="if(event.target===this)closeForm()"><div class="sheet"><div class="grab"></div><div class="sheet-head"><h2 id="formTitle"></h2><button class="close" onclick="closeForm()">×</button></div><div class="field"><label>Сумма, PLN</label><input id="amount" class="amount-input" inputmode="decimal" placeholder="0,00"></div><div class="field"><div class="field-title">Категория</div><div class="categories" id="categories"></div></div><div class="field"><label>Комментарий</label><input id="note" maxlength="80" placeholder="Необязательно"></div><div class="field"><label>Дата</label><input id="date" type="date"></div><div class="form-actions"><button class="btn" onclick="closeForm()">Отмена</button><button class="btn primary" onclick="saveTx()">Сохранить</button></div><button id="deleteTx" class="danger" hidden onclick="deleteTx()">Удалить операцию</button></div></div>
<div class="modal" id="settingsModal" onclick="if(event.target===this)closeSettings()"><div class="sheet"><div class="grab"></div><div class="sheet-head"><h2>Настройки</h2><button class="close" onclick="closeSettings()">×</button></div><div class="field"><label>Начальный общий баланс, PLN</label><input id="opening" inputmode="decimal" placeholder="0,00"></div><div class="settings-actions"><button onclick="saveOpening()">✓ Сохранить баланс</button><button onclick="exportData()">↓ Скачать резервную копию</button></div><button class="danger" onclick="resetAll()">Удалить все данные</button><div class="version">Money PWA · версия 3</div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='moneyPwaV1',expenseCats=['🛒 Продукты','🍽️ Кафе','🚗 Транспорт','🏠 Дом','👨‍👩‍👧‍👦 Семья','💊 Здоровье','🛍️ Покупки','🎮 Досуг','📱 Связь','🧾 Счета','🎁 Подарки','••• Другое'],incomeCats=['💼 Зарплата','🛵 Доставка','💸 Подработка','🎁 Подарок','↩️ Возврат','••• Другое'],$=id=>document.getElementById(id),localDate=()=>{let d=new Date(),o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,10)},money=n=>new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN'}).format(Number(n)||0),esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function load(){let r;try{r=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!r)return{version:3,opening:0,tx:[]};if(typeof r.opening==='object')return{version:3,opening:(+r.opening.cash||0)+(+r.opening.revolut||0),tx:(r.tx||[]).filter(t=>t.type!=='transfer').map(t=>({id:t.id,type:t.type,amount:+t.amount||0,category:t.category||(t.type==='income'?'💼 Зарплата':'••• Другое'),note:t.note||'',date:t.date||localDate()}))};return{version:3,opening:+r.opening||0,tx:Array.isArray(r.tx)?r.tx:[]}}
let state=load(),mode='expense',editing=null,chosen='';const persist=()=>localStorage.setItem(KEY,JSON.stringify(state));persist();
function render(){let ym=localDate().slice(0,7),nowTx=state.tx.filter(t=>t.date.startsWith(ym)),inc=nowTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),exp=nowTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),total=state.tx.reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),state.opening),now=new Date();$('total').textContent=money(total);$('income').textContent=money(inc);$('expense').textContent=money(exp);$('today').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(now);$('month').textContent=new Intl.DateTimeFormat('ru-RU',{month:'long'}).format(now);let list=$('list');list.innerHTML='';let tx=[...state.tx].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)).slice(0,40);if(!tx.length){list.innerHTML='<div class="empty glass">✨<b>Здесь появятся операции</b>Добавь первый доход или расход</div>';return}tx.forEach(t=>{let d=document.createElement('article'),p=(t.category||'••• Другое').split(' '),icon=p.shift(),title=p.join(' ')||'Другое',date=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'}).format(new Date(t.date+'T12:00:00'));d.className='tx glass';d.onclick=()=>editTx(t.id);d.innerHTML='<div class="tx-icon">'+esc(icon)+'</div><div class="tx-main"><div class="tx-title">'+esc(title)+'</div><div class="tx-meta">'+date+(t.note?' · '+esc(t.note):'')+'</div></div><div class="tx-sum '+t.type+'">'+(t.type==='expense'?'−':'+')+money(t.amount)+'</div>';list.appendChild(d)})}
function cats(){let items=mode==='income'?incomeCats:expenseCats,wrap=$('categories');wrap.innerHTML='';if(!items.includes(chosen))chosen=items[0];items.forEach(c=>{let p=c.indexOf(' '),b=document.createElement('button');b.className='category'+(c===chosen?' selected':'');b.innerHTML='<span>'+esc(c.slice(0,p))+'</span>'+esc(c.slice(p+1));b.onclick=()=>{chosen=c;cats()};wrap.appendChild(b)})}
function openForm(t){mode=t;editing=null;chosen=(t==='income'?incomeCats:expenseCats)[0];$('formTitle').textContent=t==='expense'?'Новый расход':'Новый доход';$('amount').value='';$('note').value='';$('date').value=localDate();$('deleteTx').hidden=true;cats();$('modal').classList.add('open');setTimeout(()=>$('amount').focus(),200)}function closeForm(){$('modal').classList.remove('open')}
function saveTx(){let amount=parseFloat($('amount').value.replace(',','.'));if(!(amount>0))return toast('Укажи сумму');let obj={id:editing||String(Date.now()),type:mode,amount,category:chosen,note:$('note').value.trim(),date:$('date').value||localDate()},was=!!editing;if(was)state.tx[state.tx.findIndex(x=>x.id===editing)]=obj;else state.tx.push(obj);persist();closeForm();render();editing=null;toast(was?'Операция обновлена':'Операция добавлена')}
function editTx(id){let t=state.tx.find(x=>x.id===id);mode=t.type;editing=id;chosen=t.category;$('formTitle').textContent='Редактировать';$('amount').value=String(t.amount).replace('.',',');$('note').value=t.note;$('date').value=t.date;$('deleteTx').hidden=false;cats();$('modal').classList.add('open')}function deleteTx(){if(editing&&confirm('Удалить эту операцию?')){state.tx=state.tx.filter(x=>x.id!==editing);persist();closeForm();render();toast('Операция удалена')}}
function openSettings(){$('opening').value=String(state.opening||0).replace('.',',');$('settingsModal').classList.add('open')}function closeSettings(){$('settingsModal').classList.remove('open')}function saveOpening(){let n=parseFloat($('opening').value.replace(',','.'));state.opening=Number.isFinite(n)?n:0;persist();closeSettings();render();toast('Баланс сохранён')}function exportData(){let b=new Blob([JSON.stringify({app:'Money PWA',version:3,data:state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='money-pwa-backup-'+localDate()+'.json';a.click();toast('Копия создана')}function resetAll(){if(confirm('Удалить всю историю и обнулить баланс?')){state={version:3,opening:0,tx:[]};persist();closeSettings();render();toast('Данные удалены')}}let timer;function toast(s){clearTimeout(timer);$('toast').textContent=s;$('toast').classList.add('show');timer=setTimeout(()=>$('toast').classList.remove('show'),1800)}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
