Home"}, "Семья": {"uk": "Сім’я", "pl": "Rodzina", "en": "Family"}, "Здоровье": {"uk": "Здоров’я", "pl": "Zdrowie", "en": "Health"}, "Покупки": {"uk": "Покупки", "pl": "Zakupy", "en": "Shopping"}, "Досуг": {"uk": "Дозвілля", "pl": "Rozrywka", "en": "Leisure"}, "Связь": {"uk": "Зв’язок", "pl": "Telefon", "en": "Phone"}, "Счета": {"uk": "Рахунки", "pl": "Rachunki", "en": "Bills"}, "Подарки": {"uk": "Подарунки", "pl": "Prezenty", "en": "Gifts"}, "Другое": {"uk": "Інше", "pl": "Inne", "en": "Other"}, "Зарплата": {"uk": "Зарплата", "pl": "Pensja", "en": "Salary"}, "Доставка": {"uk": "Доставка", "pl": "Dostawy", "en": "Delivery"}, "Подработка": {"uk": "Підробіток", "pl": "Dodatkowa praca", "en": "Side work"}, "Подарок": {"uk": "Подарунок", "pl": "Prezent", "en": "Gift"}, "Возврат": {"uk": "Повернення", "pl": "Zwrot", "en": "Refund"}, "Еда": {"uk": "Їжа", "pl": "Jedzenie", "en": "Food"}, "Развлечения": {"uk": "Розваги", "pl": "Rozrywka", "en": "Entertainment"}};
function tr(key){return language==='ru'?key:(translations[key]?.[language]||key)}
const staticText=[];
function bindTranslations(){
 const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
 while(walker.nextNode()){
  const node=walker.currentNode,key=node.textContent.trim();
  if(translations[key])staticText.push({node,key});
 }
 document.querySelectorAll('[placeholder],[aria-label]').forEach(el=>{
  for(const attr of ['placeholder','aria-label']){
   const key=el.getAttribute(attr);if(translations[key])el.dataset[attr==='placeholder'?'placeholderKey':'ariaKey']=key;
  }
 });
}
function translateUI(){
 document.documentElement.lang=language;document.title=tr('Мои финансы');
 staticText.forEach(({node,key})=>{if(node.isConnected)node.textContent=tr(key)});
 document.querySelectorAll('[data-placeholder-key]').forEach(el=>el.setAttribute('placeholder',tr(el.dataset.placeholderKey)));
 document.querySelectorAll('[data-aria-key]').forEach(el=>el.setAttribute('aria-label',tr(el.dataset.ariaKey)));
 $('language').value=language;updateSoundToggle();
}
function setLanguage(value){
 if(!locales[value])return;language=value;localStorage.setItem(LANG_KEY,value);
 for(const item of amountMotion.values())cancelAnimationFrame(item.frame);amountMotion.clear();translateUI();render();
}

const KEY='moneyPwaV1',expenseCats=['🛒 Продукты','🍽️ Кафе','🚗 Транспорт','🏠 Дом','👨‍👩‍👧‍👦 Семья','💊 Здоровье','🛍️ Покупки','🎮 Досуг','📱 Связь','🧾 Счета','🎁 Подарки','••• Другое'],incomeCats=['💼 Зарплата','🛵 Доставка','💸 Подработка','🎁 Подарок','↩️ Возврат','••• Другое'],$=id=>document.getElementById(id),localDate=()=>{let d=new Date(),o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,10)},money=n=>new Intl.NumberFormat(locales[language],{style:'currency',currency:'PLN'}).format(Number(n)||0),esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function load(){let r;try{r=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!r)return{version:3,opening:0,tx:[]};if(typeof r.opening==='object')return{version:3,opening:(+r.opening.cash||0)+(+r.opening.revolut||0),tx:(r.tx||[]).filter(t=>t.type!=='transfer').map(t=>({id:t.id,type:t.type,amount:+t.amount||0,category:t.category||(t.type==='income'?'💼 Зарплата':'••• Другое'),note:t.note||'',date:t.date||localDate()}))};return{version:3,opening:+r.opening||0,tx:Array.isArray(r.tx)?r.tx:[]}}

// Animate displayed amounts only; stored financial values stay exact.
const amountMotion=new Map();
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
function animateMoney(id,target){
  const el=$(id),previous=amountMotion.get(id);
  if(previous)cancelAnimationFrame(previous.frame);
  const item={value:previous?previous.value:target,frame:0};
  amountMotion.set(id,item);
  if(!previous||reducedMotion.matches||item.value===target){item.value=target;el.textContent=money(target);return}
  const start=item.value,began=performance.now(),duration=480;
  function step(now){
    const progress=Math.min(1,(now-began)/duration);
    item.value=progress===1?target:start+(target-start)*(1-Math.pow(1-progress,3));
    el.textContent=money(item.value);
    if(progress<1)item.frame=requestAnimationFrame(step);
  }
  item.frame=requestAnimationFrame(step);
}

let particleTimer;
function animateTransaction(type){
 document.querySelectorAll('.money-particle').forEach(el=>el.remove());
 clearTimeout(particleTimer);
 if(reducedMotion.matches||document.hidden)return;
 const rect=$('total').getBoundingClientRect();
 const center=Math.max(60,Math.min(window.innerWidth-60,rect.left+rect.width/2));
 const y=Math.max(70,Math.min(window.innerHeight-100,rect.bottom+5));
 for(let i=0;i<5;i++){
  const particle=document.createElement('span');particle.className='money-particle '+type;
  particle.setAttribute('aria-hidden','true');particle.textContent=type==='income'?'+ zł':'− zł';
  particle.style.left=(center+(i-2)*22)+'px';particle.style.top=y+'px';
  particle.style.setProperty('--dx',((i-2)*21)+'px');
  particle.style.setProperty('--dy',(type==='income'?-65-Math.abs(i-2)*8:48+Math.abs(i-2)*8)+'px');
  particle.style.animationDelay=(i*30)+'ms';document.body.appendChild(particle);
  particle.addEventListener('animationend',()=>particle.remove(),{once:true});
 }
 particleTimer=setTimeout(()=>document.querySelectorAll('.money-particle').forEach(el=>el.remove()),1100);
}

const SOUND_KEY='moneyPwaSoundEnabled';
let soundEnabled=localStorage.getItem(SOUND_KEY)!=='false',audioContext=null,soundGeneration=0;
const activeTones=new Set();
function updateSoundToggle(){
  $('soundToggle').setAttribute('aria-checked',String(soundEnabled));
  $('soundState').textContent=tr(soundEnabled?'Вкл.':'Выкл.');
}
function stopTones(){for(const tone of activeTones){try{tone.stop()}catch(e){}}activeTones.clear()}
function toggleSound(){soundEnabled=!soundEnabled;localStorage.setItem(SOUND_KEY,String(soundEnabled));soundGeneration++;if(!soundEnabled)stopTones();updateSoundToggle()}
function playTransactionSound(type){
  if(!soundEnabled)return;
  const generation=++soundGeneration;
  try{
    const Audio=window.AudioContext||window.webkitAudioContext;
    if(!Audio)return;
    if(!audioContext||audioContext.state==='closed')audioContext=new Audio();
    // Called directly from Save's tap, so Safari can unlock audio.
    const ready=audioContext.state==='running'?Promise.resolve():audioContext.resume();
    ready.then(()=>{
      if(!soundEnabled||generation!==soundGeneration)return;
      stopTones();
      const now=audioContext.currentTime;
      function tone(hz,offset,duration,volume,wave='sine'){
        const oscillator=audioContext.createOscillator(),gain=audioContext.createGain(),at=now+offset;
        oscillator.type=wave;oscillator.frequency.setValueAtTime(hz,at);
        gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(volume,at+.008);
        gain.gain.exponentialRampToValueAtTime(.0001,at+duration);
        oscillator.connect(gain);gain.connect(audioContext.destination);
        activeTones.add(oscillator);
        oscillator.onended=()=>{activeTones.delete(oscillator);oscillator.disconnect();gain.disconnect()};
        oscillator.start(at);oscillator.stop(at+duration+.02);
      }
      if(type==='income'){
        tone(1800,0,.035,.025,'triangle');
        tone(2300,.045,.04,.018,'triangle');
        tone(1318.5,.09,.3,.055);tone(2637,.09,.22,.012);
        tone(1760,.17,.3,.035);
      }else{
        tone(440,0,.18,.045);tone(349.23,.12,.2,.04);tone(293.66,.25,.25,.035);
      }
    }).catch(()=>{});
  }catch(e){/* Audio availability must never prevent saving an operation. */}
}
