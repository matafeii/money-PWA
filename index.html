<!doctype html><html lang='ru'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#111827'><link rel='manifest' href='manifest.webmanifest'><title>Мои расходы</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Arial,sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.app{max-width:620px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}h1{font-size:28px;margin:4px 0 18px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:18px;padding:15px;box-shadow:0 3px 15px #0000000b}.card.total{grid-column:1/-1;background:#111827;color:white}.label{font-size:13px;opacity:.65}.amount{font-size:24px;font-weight:750;margin-top:5px}.month{margin-top:10px;font-size:14px;opacity:.8}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}button{border:0;border-radius:14px;padding:13px 8px;font-size:15px;font-weight:650;background:white}button.primary{background:#111827;color:white}.section{margin-top:22px}.section h2{font-size:18px;margin:0 0 10px}.tx{display:flex;align-items:center;gap:10px;background:white;padding:12px;border-radius:15px;margin:8px 0}.ico{width:42px;height:42px;border-radius:13px;background:#f3f4f6;display:grid;place-items:center;font-size:20px}.txmain{flex:1}.txcat{font-weight:650}.txmeta{font-size:12px;color:#6b7280;margin-top:3px}.txamt{font-weight:750}.expense{color:#dc2626}.income{color:#16a34a}.empty{text-align:center;color:#6b7280;background:white;border-radius:16px;padding:24px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:min(620px,100%);background:#f9fafb;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet h2{margin:0 0 15px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#6b7280;margin:0 0 5px 3px}input,select{width:100%;padding:13px;border:1px solid #e5e7eb;border-radius:13px;background:white;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.sheetBtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.danger{background:#fee2e2;color:#991b1b}.hint{font-size:12px;color:#6b7280;margin-top:14px;text-align:center}
</style></head><body><main class='app'><h1>Мои расходы</h1><div class='cards'><div class='card total'><div class='label'>Общий баланс</div><div class='amount' id='total'>0,00 zł</div><div class='month' id='monthStat'>Расходы за месяц: 0,00 zł</div></div><div class='card'><div class='label'>💵 Наличные</div><div class='amount' id='cash'>0,00 zł</div></div><div class='card'><div class='label'>💳 Revolut</div><div class='amount' id='revolut'>0,00 zł</div></div></div><div class='actions'><button class='primary' onclick="openForm('expense')">− Расход</button><button onclick="openForm('income')">＋ Доход</button><button onclick="openForm('transfer')">⇄ Перевод</button></div><section class='section'><h2>Последние операции</h2><div id='list'></div></section><div class='hint'>Данные хранятся только в этом браузере на устройстве.</div></main><div class='modal' id='modal' onclick='if(event.target===this)closeForm()'><div class='sheet'><h2 id='formTitle'>Новая операция</h2><div class='field'><label>Сумма, PLN</label><input id='amount' inputmode='decimal' placeholder='0,00'></div><div class='field'><label id='accountLabel'>Счёт</label><select id='account'><option value='cash'>💵 Наличные</option><option value='revolut'>💳 Revolut</option></select></div><div class='field' id='toWrap' style='display:none'><label>На счёт</label><select id='toAccount'><option value='revolut'>💳 Revolut</option><option value='cash'>💵 Наличные</option></select></div><div class='field' id='catWrap'><label>Категория</label><select id='category'><option>🍔 Еда</option><option>🛒 Продукты</option><option>⛽ Транспорт</option><option>🏠 Дом</option><option>👨‍👩‍👧‍👦 Семья</option><option>💊 Здоровье</option><option>👕 Покупки</option><option>🎮 Развлечения</option><option>💰 Зарплата</option><option>📦 Другое</option></select></div><div class='field'><label>Комментарий</label><input id='note' placeholder='Необязательно'></div><div class='field'><label>Дата</label><input id='date' type='date'></div><div class='sheetBtns'><button onclick='closeForm()'>Отмена</button><button class='primary' onclick='saveTx()'>Сохранить</button></div><button class='danger' style='width:100%;margin-top:10px' onclick='resetAll()'>Удалить все данные</button></div></div><script>
const KEY='moneyPwaV1';let state=JSON.parse(localStorage.getItem(KEY)||'{"opening":{"cash":0,"revolut":0},"tx":[]}');let mode='expense';const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN'}).format(n);function balances(){let b={...state.opening};for(const t of state.tx){if(t.type==='income')b[t.account]+=t.amount;if(t.type==='expense')b[t.account]-=t.amount;if(t.type==='transfer'){b[t.account]-=t.amount;b[t.to]+=t.amount}}return b}function render(){const b=balances();$('cash').textContent=money(b.cash);$('revolut').textContent=money(b.revolut);$('total').textContent=money(b.cash+b.revolut);const now=new Date(), ym=now.toISOString().slice(0,7);const m=state.tx.filter(t=>t.type==='expense'&&t.date.startsWith(ym)).reduce((s,t)=>s+t.amount,0);$('monthStat').textContent='Расходы за месяц: '+money(m);const list=$('list');list.innerHTML='';const tx=[...state.tx].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)).slice(0,30);if(!tx.length){list.innerHTML='<div class="empty">Пока операций нет.<br>Добавь первый доход или расход.</div>';return}for(const t of tx){const d=document.createElement('div');d.className='tx';let icon=t.type==='expense'?'−':t.type==='income'?'+':'⇄';let title=t.type==='transfer'?'Перевод':t.category;let acc=t.account==='cash'?'Наличные':'Revolut';if(t.type==='transfer')acc+=' → '+(t.to==='cash'?'Наличные':'Revolut');d.innerHTML=`<div class="ico">${icon}</div><div class="txmain"><div class="txcat">${title}</div><div class="txmeta">${t.date} · ${acc}${t.note?' · '+escapeHtml(t.note):''}</div></div><div class="txamt ${t.type}">${t.type==='expense'?'-':t.type==='income'?'+':''}${money(t.amount)}</div>`;list.appendChild(d)}}function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function openForm(t){mode=t;$('modal').classList.add('open');$('formTitle').textContent=t==='expense'?'Новый расход':t==='income'?'Новый доход':'Перевод';$('toWrap').style.display=t==='transfer'?'block':'none';$('catWrap').style.display=t==='transfer'?'none':'block';$('date').value=new Date().toISOString().slice(0,10);$('amount').value='';$('note').value=''}function closeForm(){$('modal').classList.remove('open')}function saveTx(){const amount=parseFloat($('amount').value.replace(',','.'));if(!(amount>0))return alert('Укажи сумму');const account=$('account').value,to=$('toAccount').value;if(mode==='transfer'&&account===to)return alert('Выбери другой счёт');state.tx.push({id:String(Date.now()),type:mode,amount,account,to:mode==='transfer'?to:null,category:mode==='transfer'?null:$('category').value,note:$('note').value.trim(),date:$('date').value||new Date().toISOString().slice(0,10)});localStorage.setItem(KEY,JSON.stringify(state));closeForm();render()}function resetAll(){if(confirm('Удалить всю историю и обнулить балансы?')){localStorage.removeItem(KEY);state={opening:{cash:0,revolut:0},tx:[]};closeForm();render()}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
